name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend (dev extras)
        working-directory: backend
        run: pip install ".[dev]"

      # `eval/` est à la racine (hors backend/) mais doit suivre les mêmes règles :
      # --config force le pyproject du backend sur les deux arborescences (comme `make lint`).
      - name: Ruff check
        run: ruff check --config backend/pyproject.toml backend eval

      - name: Ruff format --check
        run: ruff format --check --config backend/pyproject.toml backend eval

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite (Docker Compose)
        run: >
          docker compose --env-file .env.test
          -f docker-compose.yml -f docker-compose.test.yml
          run --rm backend pytest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test -- --run

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e
