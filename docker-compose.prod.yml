# PRODUCTION : image buildée (sans dépendances dev), workers Uvicorn, healthcheck, redémarrage auto.
# Pas de volume de code monté (l'image est figée).
# Lancement : make prod
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      args:
        INSTALL_DEV: "false"
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
