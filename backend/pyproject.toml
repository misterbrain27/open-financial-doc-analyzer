[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-doc-analyzer"
version = "0.1.0"
description = "Mini-RAG sur documents financiers — backend FastAPI (embeddings Ollama, génération Groq)."
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "httpx>=0.27",
    "mistralai>=1.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "debugpy>=1.8",
    "reportlab>=4.2",  # génération de PDF de test (fixtures)
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` en valeur par défaut est l'idiome FastAPI standard (pas un bug B008) :
# https://docs.astral.sh/ruff/rules/function-call-in-default-argument/
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
# Déclaration explicite : le tri des imports ne dépend plus du répertoire d'exécution.
# La CI lance Ruff depuis la racine (`ruff check ... backend eval`), où la détection
# automatique de `app`/`tests` comme first-party ne fonctionnerait pas (ils sont sous backend/).
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Une seule boucle asyncio pour toute la session : le moteur SQLAlchemy async
# (`app.db.engine`) est un singleton créé une fois à l'import — le réutiliser sur des
# boucles différentes par test casse asyncpg ("another operation is in progress").
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
